name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-latest
            python-version: "3.15"
          - os: macos-latest
            python-version: "3.15"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run security test suite
        run: python -m pytest tests/test_security.py -v

      - name: Run full test suite
        run: python -m pytest

  package-and-audit:
    name: Build Verification & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build and audit tools
        run: |
          python -m pip install --upgrade pip build twine pip-audit

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate package metadata
        run: python -m twine check --strict dist/*

      - name: Smoke-test wheel installation and audit runtime dependencies
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install dist/*.whl
          /tmp/smoke-venv/bin/python -c "
          import modern_httplib2.auto
          import httplib2, modern_httplib2
          assert httplib2 is modern_httplib2
          assert httplib2.__name__ == 'modern-httplib2'
          assert httplib2.__version__ == modern_httplib2.__version__
          print('Smoke test passed:', httplib2.__name__, httplib2.__version__)
          "
          SITE_PKGS=$(/tmp/smoke-venv/bin/python -c "import sysconfig; print(sysconfig.get_path('purelib'))")
          python -m pip_audit --path "$SITE_PKGS"
